<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dentalis-web/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="Dentalis AI — نظام إدارة عيادات الأسنان السحابي المتكامل: مواعيد، مرضى، علاجات، فواتير وتقارير. The cloud clinic-management platform for modern dental practices.">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#007AFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0F">

  <!-- Open Graph / Twitter (share previews) -->
  <meta property="og:title" content="Dentalis AI — نظام إدارة عيادات الأسنان">
  <meta property="og:description" content="منصة سحابية متكاملة لإدارة عيادات الأسنان — مواعيد ومرضى وعلاجات وفواتير وتقارير.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="logo.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dentalis Go">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dentalis Go</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="2921613478-t7n8su8q6a9r7p3sju4ndktu61i9f03q.apps.googleusercontent.com">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <!-- [WEB-PERF 2026-11-04] start the big bundle download immediately —
       flutter_bootstrap.js would otherwise chain it after its own fetch. -->
  <link rel="preload" as="script" href="main.dart.js">

  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #F5F7FA;
      font-family: 'Cairo', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) { body { background: #0B0B0F; } }
    .splash { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .splash img {
      width: 96px; height: 96px; object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0,122,255,.28));
      animation: rise .6s cubic-bezier(.175,.885,.32,1.275);
    }
    .splash .name { font-size: 22px; font-weight: 700; color: #0B0B0F; letter-spacing: .3px; }
    .splash .bar { width: 132px; height: 4px; border-radius: 4px; background: #E2E8F0; overflow: hidden; position: relative; }
    .splash .bar::after {
      content: ''; position: absolute; inset: 0; width: 40%; border-radius: 4px;
      background: linear-gradient(90deg, #007AFF, #34C759);
      animation: slide 1.1s ease-in-out infinite;
    }
    .splash .sub { font-size: 12px; color: #64748B; letter-spacing: .4px; }
    @keyframes rise { from { transform: translateY(10px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-color-scheme: dark) {
      .splash .name { color: #F2F2F7; }
      .splash .bar { background: #2C2C2E; }
      .splash .sub { color: #AEAEB2; }
    }
  </style>
</head>
<body>
  <div class="splash" id="loading">
    <img src="logo.png" alt="">
    <div class="name">Dentalis AI</div>
    <div class="bar"></div>
    <div class="sub">Loading Dentalis Go…</div>
  </div>

  <script>
    // [WEB 2026-11-03] hide the splash once Flutter paints its first frame
    // (engine event + canvas poll cover engine variants; the splash must stay
    // up during the whole download — it is the app's loading experience).
    (function () {
      function hideSplash() {
        var el = document.getElementById('loading');
        if (el) { el.style.display = 'none'; }
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      document.addEventListener('flutter-first-frame', hideSplash);
      var poll = setInterval(function () {
        var view = document.querySelector('flutter-view');
        if (view && (view.querySelector('canvas') || (view.shadowRoot && view.shadowRoot.querySelector('canvas')))) {
          hideSplash();
          clearInterval(poll);
        }
      }, 400);
    })();
    // [WEB 2026-11-04] register the app-shell service worker — Flutter
    // 3.47's own worker is a self-uninstalling stub with no caching.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
        navigator.serviceWorker.addEventListener('message', function (e) {
          if (e.data === 'dentalis-reload-app') { location.reload(); }
        });
      });
    }
    // [WEB 2026-11-04] when a new deployment lands (version.json changed),
    // reload ONCE — but only for visitors who already had an older build
    // (first-ever visitors must never pay an extra reload).
    (function () {
      fetch('version.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (!v) return;
          var key = 'dentalis-build-' + v.version + '+' + v.build_number;
          if (localStorage.getItem(key)) return; // already on this build
          var hadPrevious = Object.keys(localStorage).some(function (k) {
            return k.indexOf('dentalis-build-') === 0;
          });
          Object.keys(localStorage).forEach(function (k) {
            if (k.indexOf('dentalis-build-') === 0) localStorage.removeItem(k);
          });
          localStorage.setItem(key, '1');
          if (hadPrevious) location.reload();
        })
        .catch(function () {});
    })();
  </script>
  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';
    globalThis.pdfjsLib = pdfjsLib;
    window.pdfjsLib = pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
    globalThis.pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true,
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
